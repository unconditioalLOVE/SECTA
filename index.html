<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SECTA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #ffffff;
    --surface: #f9f9fb;
    --ink: #0f0f11;
    --ink-2: #52525b;
    --ink-3: #8e8e98;
    --line: rgba(15, 15, 17, 0.08);
    --line-strong: rgba(15, 15, 17, 0.16);
    --accent: #0f0f11;
    --accent-ink: #ffffff;
    --danger: #d92d20;
    --ring-track: rgba(15, 15, 17, 0.08);
    --ring-active: #0f0f11;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 10px 30px -10px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 24px 60px -15px rgba(0, 0, 0, 0.16);
    --radius: 20px;
    --radius-sm: 12px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }

  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: 36px 20px 120px;
  }

  /* Header */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand-name {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 36px;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .brand-sub {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ghost-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--ink-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s var(--ease);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .ghost-btn:hover {
    color: var(--ink);
    background: var(--surface);
  }

  .ghost-btn.active {
    color: var(--ink);
    background: var(--surface);
    border-color: var(--line-strong);
  }

  /* Group Filter Bar */
  .groups-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
    margin-bottom: 24px;
  }

  .groups-wrap::-webkit-scrollbar {
    display: none;
  }

  .group-chip {
    flex: 0 0 auto;
    height: 34px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all 0.2s var(--ease);
  }

  .group-chip:hover {
    border-color: var(--line-strong);
    color: var(--ink);
  }

  .group-chip.is-active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  .group-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .group-chip.is-active .group-dot {
    box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.55);
  }

  .group-count {
    font-size: 11px;
    opacity: 0.55;
    font-variant-numeric: tabular-nums;
  }

  /* Section label */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 28px 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-label:first-of-type {
    margin-top: 0;
  }

  /* Timer Cards */
  .timer-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .timer-card {
    position: relative;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 16px;
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s var(--ease), opacity 0.25s var(--ease);
    box-shadow: var(--shadow-sm);
  }

  .timer-card:hover {
    border-color: var(--line-strong);
  }

  .timer-card.is-running {
    border-color: rgba(15, 15, 17, 0.22);
    box-shadow: var(--shadow-md);
  }

  .timer-card.is-completed {
    background: #fcfcfd;
    border-color: rgba(15, 15, 17, 0.25);
  }

  .timer-card.dragging {
    opacity: 0.45;
    transform: scale(0.985);
  }

  .timer-card.drag-over {
    border-top: 2px solid var(--ink);
  }

  /* Ring */
  .ring-box {
    position: relative;
    width: 56px;
    height: 56px;
    cursor: pointer;
  }

  .ring-box svg {
    width: 56px;
    height: 56px;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: var(--ring-track);
    stroke-width: 3;
  }

  .ring-fill {
    fill: none;
    stroke: var(--ring-active);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear, stroke 0.25s var(--ease);
  }

  .timer-card:not(.is-running) .ring-fill {
    stroke: var(--ink-2);
  }

  .timer-card.is-completed .ring-fill {
    stroke: var(--ink);
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }

  /* Content */
  .timer-main {
    min-width: 0;
    cursor: pointer;
  }

  .timer-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
  }

  .timer-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .timer-card.is-running .timer-title {
    color: var(--ink);
    font-weight: 600;
  }

  .timer-group-tag {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-3);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  .timer-group-tag::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--tag-color, var(--ink-3));
  }

  .timer-readout {
    font-size: 30px;
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .timer-card:not(.is-running):not(.is-completed) .timer-readout {
    color: var(--ink);
  }

  .timer-card.is-completed .timer-readout {
    animation: pulseReadout 1.4s ease-in-out infinite;
  }

  @keyframes pulseReadout {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .timer-sub {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  /* Actions */
  .timer-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.18s var(--ease);
  }

  .icon-btn:hover {
    background: var(--surface);
    color: var(--ink);
  }

  .icon-btn.play-btn {
    width: 42px;
    height: 42px;
    background: var(--surface);
    border-color: var(--line);
    color: var(--ink);
  }

  .timer-card.is-running .icon-btn.play-btn {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  .timer-card.is-completed .icon-btn.play-btn {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  .icon-btn.danger:hover {
    color: var(--danger);
    background: rgba(217, 45, 32, 0.06);
  }

  .drag-handle {
    cursor: grab;
    color: var(--ink-3);
    opacity: 0.45;
    touch-action: none;
  }

  .drag-handle:hover {
    opacity: 1;
  }

  .drag-handle:active {
    cursor: grabbing;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 64px 20px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--ink-3);
  }

  .empty-title {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 26px;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .empty-desc {
    font-size: 13px;
    margin-bottom: 20px;
  }

  /* Floating Add Button */
  .fab-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 28px;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 20;
  }

  .fab {
    pointer-events: auto;
    height: 50px;
    padding: 0 22px 0 18px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 12px 30px -8px rgba(15, 15, 17, 0.45), 0 2px 6px rgba(15, 15, 17, 0.12);
    transition: transform 0.22s var(--ease), box-shadow 0.22s var(--ease);
  }

  .fab:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 36px -8px rgba(15, 15, 17, 0.5), 0 4px 10px rgba(15, 15, 17, 0.14);
  }

  .fab:active {
    transform: scale(0.97);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 15, 17, 0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.24s var(--ease);
    z-index: 50;
  }

  @media (min-width: 600px) {
    .modal-backdrop {
      align-items: center;
    }
  }

  .modal-backdrop.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    width: 100%;
    max-width: 440px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 24px;
    box-shadow: var(--shadow-lg);
    transform: translateY(16px) scale(0.985);
    transition: transform 0.28s var(--ease);
    max-height: 90dvh;
    overflow-y: auto;
  }

  .modal-backdrop.is-open .modal {
    transform: translateY(0) scale(1);
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .modal-title {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 26px;
    font-weight: 400;
    margin: 0;
    line-height: 1;
  }

  .field {
    margin-bottom: 18px;
  }

  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 8px;
  }

  .text-input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line-strong);
    background: var(--bg);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s var(--ease);
  }

  .text-input:focus {
    border-color: var(--ink);
  }

  /* Duration Wheel / Drum Picker */
  .hms-picker {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 10px;
  }

  .hms-sep {
    font-size: 22px;
    font-weight: 300;
    color: var(--ink-3);
    text-align: center;
    padding-bottom: 18px;
  }

  .drum-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .drum-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: 4px;
  }

  .drum {
    position: relative;
    height: 120px;
    width: 100%;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .drum::-webkit-scrollbar {
    display: none;
  }

  .drum-pad {
    height: 40px;
  }

  .drum-item {
    height: 40px;
    scroll-snap-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    cursor: pointer;
    user-select: none;
    transition: color 0.15s ease, transform 0.15s ease, font-weight 0.15s ease;
  }

  .drum-item.is-selected {
    color: var(--ink);
    font-weight: 600;
    font-size: 25px;
  }

  .drum-highlight {
    position: pointer-events;
    pointer-events: none;
  }

  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }

  .preset-btn {
    height: 30px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-2);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s var(--ease);
  }

  .preset-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  /* Group selector in modal */
  .group-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .group-pill {
    height: 32px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-2);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.18s var(--ease);
  }

  .group-pill.is-selected {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  /* Color swatches */
  .swatches {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.18s var(--ease);
    position: relative;
  }

  .swatch.is-selected {
    transform: scale(1.12);
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
  }

  /* Group manager list */
  .group-manage-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }

  .group-manage-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }

  .group-manage-left {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 500;
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 22px;
  }

  .btn {
    height: 42px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s var(--ease);
  }

  .btn:hover {
    background: var(--surface);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  .btn-primary:hover {
    opacity: 0.9;
    background: var(--accent);
  }

  .btn-danger-text {
    color: var(--danger);
    border-color: transparent;
    margin-right: auto;
    padding-left: 4px;
  }

  .btn-danger-text:hover {
    background: rgba(217, 45, 32, 0.06);
  }

  /* Sound toggle indicator */
  .sound-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink);
    display: inline-block;
  }

  .ghost-btn:not(.active) .sound-dot {
    background: var(--ink-3);
    opacity: 0.4;
  }

  .inline-row {
    display: flex;
    gap: 8px;
  }

  .inline-row .text-input {
    flex: 1;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">
      <div class="brand-name">SECTA</div>
      <div class="brand-sub">Timers</div>
    </div>
    <div class="header-actions">
      <button class="ghost-btn active" id="soundToggle" type="button" title="通知音">
        <span class="sound-dot"></span>
        <span>Sound</span>
      </button>
      <button class="ghost-btn" id="manageGroupsBtn" type="button">Groups</button>
    </div>
  </header>

  <div class="groups-wrap" id="groupFilterBar"></div>

  <div id="timersContainer"></div>
</div>

<div class="fab-wrap">
  <button class="fab" id="openAddBtn" type="button">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
    <span>New Timer</span>
  </button>
</div>

<!-- Timer Add/Edit Modal -->
<div class="modal-backdrop" id="timerModalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="timerModalTitle">
    <div class="modal-head">
      <h2 class="modal-title" id="timerModalTitle">New Timer</h2>
      <button class="icon-btn" id="closeTimerModal" type="button" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="field">
      <label class="field-label" for="timerTitleInput">Label</label>
      <input class="text-input" id="timerTitleInput" type="text" placeholder="e.g. Deep Work, Tea, Stretch" maxlength="40">
    </div>

    <div class="field">
      <div class="field-label">Duration</div>
      <div class="hms-picker">
        <div class="drum-col">
          <div class="drum" id="drumHours"></div>
          <div class="drum-label">Hours</div>
        </div>
        <div class="hms-sep">:</div>
        <div class="drum-col">
          <div class="drum" id="drumMinutes"></div>
          <div class="drum-label">Min</div>
        </div>
        <div class="hms-sep">:</div>
        <div class="drum-col">
          <div class="drum" id="drumSeconds"></div>
          <div class="drum-label">Sec</div>
        </div>
      </div>
      <div class="presets">
        <button class="preset-btn" type="button" data-sec="60">1m</button>
        <button class="preset-btn" type="button" data-sec="180">3m</button>
        <button class="preset-btn" type="button" data-sec="300">5m</button>
        <button class="preset-btn" type="button" data-sec="600">10m</button>
        <button class="preset-btn" type="button" data-sec="900">15m</button>
        <button class="preset-btn" type="button" data-sec="1500">25m</button>
        <button class="preset-btn" type="button" data-sec="2700">45m</button>
        <button class="preset-btn" type="button" data-sec="3600">1h</button>
      </div>
    </div>

    <div class="field">
      <div class="field-label">Group</div>
      <div class="group-pills" id="modalGroupPills"></div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-danger-text" id="deleteTimerBtn" type="button" style="display:none;">Delete</button>
      <button class="btn" id="cancelTimerModal" type="button">Cancel</button>
      <button class="btn btn-primary" id="saveTimerBtn" type="button">Save</button>
    </div>
  </div>
</div>

<!-- Group Manager Modal -->
<div class="modal-backdrop" id="groupModalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle">
    <div class="modal-head">
      <h2 class="modal-title" id="groupModalTitle">Groups</h2>
      <button class="icon-btn" id="closeGroupModal" type="button" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="group-manage-list" id="groupManageList"></div>

    <div class="field">
      <label class="field-label" for="newGroupInput">Add Group</label>
      <div class="inline-row">
        <input class="text-input" id="newGroupInput" type="text" placeholder="Group name" maxlength="24">
        <button class="btn btn-primary" id="addGroupBtn" type="button">Add</button>
      </div>
    </div>

    <div class="field">
      <div class="field-label">Color</div>
      <div class="swatches" id="groupColorSwatches"></div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-primary" id="doneGroupModal" type="button">Done</button>
    </div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'secta_timers_v1';
  const COLORS = ['#0f0f11', '#2563eb', '#059669', '#d97706', '#dc2626', '#7c3aed'];
  const RING_RADIUS = 25;
  const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

  const defaultState = () => ({
    soundEnabled: true,
    activeGroupId: 'all',
    selectedNewGroupColor: COLORS[1],
    groups: [
      { id: 'focus', name: 'Focus', color: '#0f0f11' },
      { id: 'break', name: 'Break', color: '#059669' }
    ],
    timers: [
      {
        id: 't-1',
        title: 'Pomodoro Focus',
        durationMs: 25 * 60 * 1000,
        remainingMs: 25 * 60 * 1000,
        running: false,
        completed: false,
        endAt: null,
        groupId: 'focus'
      },
      {
        id: 't-2',
        title: 'Short Break',
        durationMs: 5 * 60 * 1000,
        remainingMs: 5 * 60 * 1000,
        running: false,
        completed: false,
        endAt: null,
        groupId: 'break'
      }
    ]
  });

  let state = loadState();
  let editingTimerId = null;
  let modalSelectedGroupId = null;
  let audioCtx = null;
  let alarmInterval = null;
  let draggedId = null;

  const el = {
    soundToggle: document.getElementById('soundToggle'),
    manageGroupsBtn: document.getElementById('manageGroupsBtn'),
    groupFilterBar: document.getElementById('groupFilterBar'),
    timersContainer: document.getElementById('timersContainer'),
    openAddBtn: document.getElementById('openAddBtn'),

    timerModalBackdrop: document.getElementById('timerModalBackdrop'),
    timerModalTitle: document.getElementById('timerModalTitle'),
    closeTimerModal: document.getElementById('closeTimerModal'),
    cancelTimerModal: document.getElementById('cancelTimerModal'),
    saveTimerBtn: document.getElementById('saveTimerBtn'),
    deleteTimerBtn: document.getElementById('deleteTimerBtn'),
    timerTitleInput: document.getElementById('timerTitleInput'),
    drumHours: document.getElementById('drumHours'),
    drumMinutes: document.getElementById('drumMinutes'),
    drumSeconds: document.getElementById('drumSeconds'),
    modalGroupPills: document.getElementById('modalGroupPills'),

    groupModalBackdrop: document.getElementById('groupModalBackdrop'),
    closeGroupModal: document.getElementById('closeGroupModal'),
    doneGroupModal: document.getElementById('doneGroupModal'),
    groupManageList: document.getElementById('groupManageList'),
    newGroupInput: document.getElementById('newGroupInput'),
    addGroupBtn: document.getElementById('addGroupBtn'),
    groupColorSwatches: document.getElementById('groupColorSwatches')
  };

  function uid(prefix = 'id') {
    return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      const base = defaultState();
      return {
        soundEnabled: typeof parsed.soundEnabled === 'boolean' ? parsed.soundEnabled : base.soundEnabled,
        activeGroupId: parsed.activeGroupId || 'all',
        selectedNewGroupColor: COLORS.includes(parsed.selectedNewGroupColor) ? parsed.selectedNewGroupColor : COLORS[1],
        groups: Array.isArray(parsed.groups) && parsed.groups.length ? parsed.groups : base.groups,
        timers: Array.isArray(parsed.timers) ? parsed.timers.map(normalizeTimer) : base.timers
      };
    } catch {
      return defaultState();
    }
  }

  function normalizeTimer(t) {
    const durationMs = Math.max(1000, Number(t.durationMs) || 60000);
    let remainingMs = typeof t.remainingMs === 'number' ? t.remainingMs : durationMs;
    let running = Boolean(t.running);
    let completed = Boolean(t.completed);
    let endAt = typeof t.endAt === 'number' ? t.endAt : null;

    if (running && endAt) {
      remainingMs = Math.max(0, endAt - Date.now());
      if (remainingMs <= 0) {
        remainingMs = 0;
        running = false;
        completed = true;
        endAt = null;
      }
    } else if (running && !endAt) {
      endAt = Date.now() + Math.max(0, remainingMs);
    }

    return {
      id: String(t.id || uid('t')),
      title: String(t.title || 'Timer'),
      durationMs,
      remainingMs,
      running,
      completed,
      endAt,
      groupId: t.groupId || null
    };
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        soundEnabled: state.soundEnabled,
        activeGroupId: state.activeGroupId,
        selectedNewGroupColor: state.selectedNewGroupColor,
        groups: state.groups,
        timers: state.timers
      }));
    } catch {}
  }

  function formatDuration(ms) {
    const totalSec = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }

  function formatClockLabel(ms) {
    const totalSec = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const parts = [];
    if (h > 0) parts.push(`${h}h`);
    if (m > 0) parts.push(`${m}m`);
    if (s > 0 || parts.length === 0) parts.push(`${s}s`);
    return parts.join(' ');
  }

  function getGroupById(id) {
    return state.groups.find((g) => g.id === id) || null;
  }

  function playChime() {
    if (!state.soundEnabled) return;
    try {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const now = audioCtx.currentTime;
      const notes = [880, 1174.66];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.14);
        gain.gain.setValueAtTime(0.0001, now + idx * 0.14);
        gain.gain.exponentialRampToValueAtTime(0.12, now + idx * 0.14 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.14 + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.14);
        osc.stop(now + idx * 0.14 + 0.48);
      });
    } catch {}
  }

  function syncAlarmLoop() {
    const anyCompleted = state.timers.some((t) => t.completed);
    if (anyCompleted && !alarmInterval) {
      playChime();
      alarmInterval = setInterval(() => {
        if (state.timers.some((t) => t.completed)) {
          playChime();
        } else {
          clearInterval(alarmInterval);
          alarmInterval = null;
        }
      }, 2400);
    } else if (!anyCompleted && alarmInterval) {
      clearInterval(alarmInterval);
      alarmInterval = null;
    }
  }

  function startTimer(id) {
    const t = state.timers.find((item) => item.id === id);
    if (!t) return;
    if (t.completed || t.remainingMs <= 0) {
      t.remainingMs = t.durationMs;
      t.completed = false;
    }
    t.running = true;
    t.endAt = Date.now() + t.remainingMs;
    saveState();
    syncAlarmLoop();
    render();
  }

  function pauseTimer(id) {
    const t = state.timers.find((item) => item.id === id);
    if (!t || !t.running) return;
    t.remainingMs = Math.max(0, (t.endAt || Date.now()) - Date.now());
    t.running = false;
    t.endAt = null;
    saveState();
    render();
  }

  function resetTimer(id) {
    const t = state.timers.find((item) => item.id === id);
    if (!t) return;
    t.running = false;
    t.completed = false;
    t.endAt = null;
    t.remainingMs = t.durationMs;
    saveState();
    syncAlarmLoop();
    render();
  }

  function deleteTimer(id) {
    state.timers = state.timers.filter((item) => item.id !== id);
    saveState();
    syncAlarmLoop();
    render();
  }

  function togglePrimaryAction(id) {
    const t = state.timers.find((item) => item.id === id);
    if (!t) return;
    if (t.completed) {
      resetTimer(id);
    } else if (t.running) {
      pauseTimer(id);
    } else {
      startTimer(id);
    }
  }

  function tick() {
    const now = Date.now();
    let changed = false;
    let newlyCompleted = false;

    for (const t of state.timers) {
      if (t.running) {
        const rem = Math.max(0, (t.endAt || now) - now);
        t.remainingMs = rem;
        changed = true;
        if (rem <= 0) {
          t.running = false;
          t.completed = true;
          t.endAt = null;
          newlyCompleted = true;
        }
      }
    }

    if (changed) {
      if (newlyCompleted) {
        saveState();
        syncAlarmLoop();
        render();
      } else {
        updateReadoutsOnly();
      }
    }
  }

  function updateReadoutsOnly() {
    for (const t of state.timers) {
      const card = el.timersContainer.querySelector(`[data-timer-id="${t.id}"]`);
      if (!card) continue;
      const readout = card.querySelector('.timer-readout');
      const ring = card.querySelector('.ring-fill');
      if (readout) readout.textContent = formatDuration(t.remainingMs);
      if (ring) {
        const ratio = t.durationMs > 0 ? Math.max(0, Math.min(1, t.remainingMs / t.durationMs)) : 0;
        ring.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - ratio));
      }
    }
  }

  function renderHeader() {
    el.soundToggle.classList.toggle('active', state.soundEnabled);
    el.soundToggle.querySelector('span:last-child').textContent = state.soundEnabled ? 'Sound' : 'Muted';
  }

  function renderGroupFilterBar() {
    const totalCount = state.timers.length;
    const chips = [
      {
        id: 'all',
        name: 'All',
        color: null,
        count: totalCount
      },
      ...state.groups.map((g) => ({
        id: g.id,
        name: g.name,
        color: g.color,
        count: state.timers.filter((t) => t.groupId === g.id).length
      }))
    ];

    const ungroupedCount = state.timers.filter((t) => !t.groupId || !getGroupById(t.groupId)).length;
    if (ungroupedCount > 0) {
      chips.push({
        id: '__none__',
        name: 'Ungrouped',
        color: '#8e8e98',
        count: ungroupedCount
      });
    }

    el.groupFilterBar.innerHTML = chips.map((c) => {
      const active = state.activeGroupId === c.id;
      const dot = c.color ? `<span class="group-dot" style="background:${c.color}"></span>` : '';
      return `
        <button class="group-chip ${active ? 'is-active' : ''}" type="button" data-filter-group="${c.id}">
          ${dot}
          <span>${escapeHtml(c.name)}</span>
          <span class="group-count">${c.count}</span>
        </button>
      `;
    }).join('');
  }

  function getFilteredTimers() {
    if (state.activeGroupId === 'all') return state.timers;
    if (state.activeGroupId === '__none__') {
      return state.timers.filter((t) => !t.groupId || !getGroupById(t.groupId));
    }
    return state.timers.filter((t) => t.groupId === state.activeGroupId);
  }

  function renderTimerCard(t) {
    const ratio = t.durationMs > 0 ? Math.max(0, Math.min(1, t.remainingMs / t.durationMs)) : 0;
    const dashOffset = RING_CIRCUMFERENCE * (1 - ratio);
    const group = t.groupId ? getGroupById(t.groupId) : null;
    const statusClass = t.completed ? 'is-completed' : (t.running ? 'is-running' : '');

    const ringIcon = t.completed
      ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`
      : (t.running
        ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>`
        : `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="7 5 19 12 7 19 7 5"></polygon></svg>`);

    const actionIcon = t.completed
      ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-4.95"></path></svg>`
      : (t.running
        ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>`
        : `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="7 5 19 12 7 19 7 5"></polygon></svg>`);

    const groupTag = group
      ? `<span class="timer-group-tag" style="--tag-color:${group.color}">${escapeHtml(group.name)}</span>`
      : '';

    const statusText = t.completed
      ? 'Completed'
      : (t.running ? `Running · ${formatClockLabel(t.durationMs)}` : `Set ${formatClockLabel(t.durationMs)}`);

    return `
      <div class="timer-card ${statusClass}" data-timer-id="${t.id}" draggable="true">
        <div class="ring-box" data-action="toggle" title="${t.running ? 'Pause' : 'Start'}">
          <svg viewBox="0 0 56 56">
            <circle class="ring-track" cx="28" cy="28" r="${RING_RADIUS}"></circle>
            <circle class="ring-fill" cx="28" cy="28" r="${RING_RADIUS}"
              stroke-dasharray="${RING_CIRCUMFERENCE}"
              stroke-dashoffset="${dashOffset}"></circle>
          </svg>
          <div class="ring-center">${ringIcon}</div>
        </div>

        <div class="timer-main" data-action="edit" title="Edit timer">
          <div class="timer-meta">
            <div class="timer-title">${escapeHtml(t.title)}</div>
            ${groupTag}
          </div>
          <div class="timer-readout">${formatDuration(t.remainingMs)}</div>
          <div class="timer-sub">${statusText}</div>
        </div>

        <div class="timer-actions">
          <button class="icon-btn play-btn" type="button" data-action="toggle" aria-label="${t.running ? 'Pause' : 'Start'}">
            ${actionIcon}
          </button>
          <button class="icon-btn" type="button" data-action="reset" title="Reset" aria-label="Reset">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 .49-4.95"></path>
            </svg>
          </button>
          <span class="icon-btn drag-handle" title="Reorder" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="9" cy="6" r="1.6"></circle>
              <circle cx="15" cy="6" r="1.6"></circle>
              <circle cx="9" cy="12" r="1.6"></circle>
              <circle cx="15" cy="12" r="1.6"></circle>
              <circle cx="9" cy="18" r="1.6"></circle>
              <circle cx="15" cy="18" r="1.6"></circle>
            </svg>
          </span>
        </div>
      </div>
    `;
  }

  function renderTimers() {
    const filtered = getFilteredTimers();
    if (filtered.length === 0) {
      el.timersContainer.innerHTML = `
        <div class="empty">
          <div class="empty-title">No timers here</div>
          <div class="empty-desc">Create a timer to start counting down.</div>
          <button class="btn btn-primary" type="button" id="emptyAddBtn">New Timer</button>
        </div>
      `;
      const emptyBtn = document.getElementById('emptyAddBtn');
      if (emptyBtn) emptyBtn.addEventListener('click', () => openTimerModal(null));
      return;
    }

    const active = filtered.filter((t) => t.running || t.completed);
    const idle = filtered.filter((t) => !t.running && !t.completed);

    let html = '';
    if (active.length > 0) {
      html += `<div class="section-label"><span>Active</span><span>${active.length}</span></div>`;
      html += `<div class="timer-list">${active.map(renderTimerCard).join('')}</div>`;
    }
    if (idle.length > 0) {
      html += `<div class="section-label"><span>Standby</span><span>${idle.length}</span></div>`;
      html += `<div class="timer-list">${idle.map(renderTimerCard).join('')}</div>`;
    }

    el.timersContainer.innerHTML = html;
    bindCardEvents();
  }

  function bindCardEvents() {
    const cards = el.timersContainer.querySelectorAll('.timer-card');
    cards.forEach((card) => {
      const id = card.getAttribute('data-timer-id');

      card.addEventListener('click', (e) => {
        const actionEl = e.target.closest('[data-action]');
        if (!actionEl) return;
        const action = actionEl.getAttribute('data-action');
        if (action === 'toggle') togglePrimaryAction(id);
        else if (action === 'reset') resetTimer(id);
        else if (action === 'edit') openTimerModal(id);
      });

      card.addEventListener('dragstart', () => {
        draggedId = id;
        card.classList.add('dragging');
      });

      card.addEventListener('dragend', () => {
        draggedId = null;
        card.classList.remove('dragging');
        el.timersContainer.querySelectorAll('.drag-over').forEach((n) => n.classList.remove('drag-over'));
      });

      card.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!draggedId || draggedId === id) return;
        card.classList.add('drag-over');
      });

      card.addEventListener('dragleave', () => {
        card.classList.remove('drag-over');
      });

      card.addEventListener('drop', (e) => {
        e.preventDefault();
        card.classList.remove('drag-over');
        if (!draggedId || draggedId === id) return;
        reorderTimers(draggedId, id);
      });
    });
  }

  function reorderTimers(sourceId, targetId) {
    const fromIdx = state.timers.findIndex((t) => t.id === sourceId);
    const toIdx = state.timers.findIndex((t) => t.id === targetId);
    if (fromIdx === -1 || toIdx === -1) return;
    const [moved] = state.timers.splice(fromIdx, 1);
    state.timers.splice(toIdx, 0, moved);
    saveState();
    render();
  }

  function render() {
    renderHeader();
    renderGroupFilterBar();
    renderTimers();
  }

  /* Drum Picker */
  function buildDrum(container, maxVal) {
    const pad = '<div class="drum-pad"></div>';
    const items = [];
    for (let i = 0; i <= maxVal; i++) {
      items.push(`<div class="drum-item" data-val="${i}">${String(i).padStart(2, '0')}</div>`);
    }
    container.innerHTML = pad + items.join('') + pad;

    let scrollTimer = null;
    container.addEventListener('scroll', () => {
      if (scrollTimer) clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const idx = Math.round(container.scrollTop / 40);
        const clamped = Math.max(0, Math.min(maxVal, idx));
        container.scrollTo({ top: clamped * 40, behavior: 'smooth' });
        highlightDrum(container, clamped);
      }, 60);
    }, { passive: true });

    container.addEventListener('click', (e) => {
      const item = e.target.closest('.drum-item');
      if (!item) return;
      const val = Number(item.getAttribute('data-val'));
      container.scrollTo({ top: val * 40, behavior: 'smooth' });
      highlightDrum(container, val);
    });
  }

  function highlightDrum(container, selectedVal) {
    container.querySelectorAll('.drum-item').forEach((item) => {
      const v = Number(item.getAttribute('data-val'));
      item.classList.toggle('is-selected', v === selectedVal);
    });
  }

  function setDrumValues(hours, minutes, seconds) {
    const h = Math.max(0, Math.min(23, hours));
    const m = Math.max(0, Math.min(59, minutes));
    const s = Math.max(0, Math.min(59, seconds));
    el.drumHours.scrollTop = h * 40;
    el.drumMinutes.scrollTop = m * 40;
    el.drumSeconds.scrollTop = s * 40;
    highlightDrum(el.drumHours, h);
    highlightDrum(el.drumMinutes, m);
    highlightDrum(el.drumSeconds, s);
  }

  function getDrumDurationMs() {
    const h = Math.max(0, Math.min(23, Math.round(el.drumHours.scrollTop / 40)));
    const m = Math.max(0, Math.min(59, Math.round(el.drumMinutes.scrollTop / 40)));
    const s = Math.max(0, Math.min(59, Math.round(el.drumSeconds.scrollTop / 40)));
    return ((h * 3600) + (m * 60) + s) * 1000;
  }

  function renderModalGroupPills() {
    const pills = [
      `<button type="button" class="group-pill ${modalSelectedGroupId === null ? 'is-selected' : ''}" data-pick-group="">None</button>`,
      ...state.groups.map((g) => `
        <button type="button" class="group-pill ${modalSelectedGroupId === g.id ? 'is-selected' : ''}" data-pick-group="${g.id}">
          <span class="group-dot" style="background:${g.color}"></span>
          <span>${escapeHtml(g.name)}</span>
        </button>
      `)
    ];
    el.modalGroupPills.innerHTML = pills.join('');
    el.modalGroupPills.querySelectorAll('[data-pick-group]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-pick-group');
        modalSelectedGroupId = val || null;
        renderModalGroupPills();
      });
    });
  }

  function openTimerModal(timerId) {
    editingTimerId = timerId;
    if (timerId) {
      const t = state.timers.find((item) => item.id === timerId);
      if (!t) return;
      el.timerModalTitle.textContent = 'Edit Timer';
      el.timerTitleInput.value = t.title;
      const totalSec = Math.round(t.durationMs / 1000);
      setDrumValues(
        Math.floor(totalSec / 3600),
        Math.floor((totalSec % 3600) / 60),
        totalSec % 60
      );
      modalSelectedGroupId = t.groupId && getGroupById(t.groupId) ? t.groupId : null;
      el.deleteTimerBtn.style.display = 'inline-flex';
    } else {
      el.timerModalTitle.textContent = 'New Timer';
      el.timerTitleInput.value = '';
      setDrumValues(0, 5, 0);
      modalSelectedGroupId = (state.activeGroupId !== 'all' && state.activeGroupId !== '__none__' && getGroupById(state.activeGroupId))
        ? state.activeGroupId
        : null;
      el.deleteTimerBtn.style.display = 'none';
    }

    renderModalGroupPills();
    el.timerModalBackdrop.classList.add('is-open');
    el.timerModalBackdrop.setAttribute('aria-hidden', 'false');
    setTimeout(() => el.timerTitleInput.focus(), 60);
  }

  function closeTimerModal() {
    el.timerModalBackdrop.classList.remove('is-open');
    el.timerModalBackdrop.setAttribute('aria-hidden', 'true');
    editingTimerId = null;
  }

  function handleSaveTimer() {
    let durationMs = getDrumDurationMs();
    if (durationMs <= 0) {
      durationMs = 60 * 1000;
    }
    const title = el.timerTitleInput.value.trim() || formatClockLabel(durationMs);

    if (editingTimerId) {
      const t = state.timers.find((item) => item.id === editingTimerId);
      if (t) {
        const prevDuration = t.durationMs;
        t.title = title;
        t.durationMs = durationMs;
        t.groupId = modalSelectedGroupId;
        if (!t.running && !t.completed) {
          t.remainingMs = durationMs;
        } else if (t.running && prevDuration !== durationMs) {
          t.remainingMs = Math.min(durationMs, t.remainingMs);
          t.endAt = Date.now() + t.remainingMs;
        }
      }
    } else {
      state.timers.unshift({
        id: uid('t'),
        title,
        durationMs,
        remainingMs: durationMs,
        running: false,
        completed: false,
        endAt: null,
        groupId: modalSelectedGroupId
      });
    }

    saveState();
    syncAlarmLoop();
    closeTimerModal();
    render();
  }

  /* Group Manager */
  function renderGroupSwatches() {
    el.groupColorSwatches.innerHTML = COLORS.map((c) => `
      <button type="button" class="swatch ${state.selectedNewGroupColor === c ? 'is-selected' : ''}"
        style="background:${c}" data-swatch="${c}" aria-label="${c}"></button>
    `).join('');

    el.groupColorSwatches.querySelectorAll('[data-swatch]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.selectedNewGroupColor = btn.getAttribute('data-swatch');
        saveState();
        renderGroupSwatches();
      });
    });
  }

  function renderGroupManageList() {
    if (state.groups.length === 0) {
      el.groupManageList.innerHTML = `<div style="font-size:13px;color:var(--ink-3);">No groups created yet.</div>`;
      return;
    }

    el.groupManageList.innerHTML = state.groups.map((g) => {
      const count = state.timers.filter((t) => t.groupId === g.id).length;
      return `
        <div class="group-manage-row">
          <div class="group-manage-left">
            <span class="group-dot" style="background:${g.color};width:9px;height:9px;"></span>
            <span>${escapeHtml(g.name)}</span>
            <span style="font-size:12px;color:var(--ink-3);">(${count})</span>
          </div>
          <button type="button" class="icon-btn danger" data-del-group="${g.id}" title="Delete group" aria-label="Delete group">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
          </button>
        </div>
      `;
    }).join('');

    el.groupManageList.querySelectorAll('[data-del-group]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const gid = btn.getAttribute('data-del-group');
        state.groups = state.groups.filter((g) => g.id !== gid);
        state.timers.forEach((t) => {
          if (t.groupId === gid) t.groupId = null;
        });
        if (state.activeGroupId === gid) state.activeGroupId = 'all';
        saveState();
        renderGroupManageList();
        render();
      });
    });
  }

  function openGroupModal() {
    renderGroupManageList();
    renderGroupSwatches();
    el.newGroupInput.value = '';
    el.groupModalBackdrop.classList.add('is-open');
    el.groupModalBackdrop.setAttribute('aria-hidden', 'false');
  }

  function closeGroupModal() {
    el.groupModalBackdrop.classList.remove('is-open');
    el.groupModalBackdrop.setAttribute('aria-hidden', 'true');
  }

  function handleAddGroup() {
    const name = el.newGroupInput.value.trim();
    if (!name) return;
    state.groups.push({
      id: uid('g'),
      name,
      color: state.selectedNewGroupColor
    });
    el.newGroupInput.value = '';
    saveState();
    renderGroupManageList();
    render();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* Global Event Listeners */
  el.soundToggle.addEventListener('click', () => {
    state.soundEnabled = !state.soundEnabled;
    if (state.soundEnabled) playChime();
    saveState();
    renderHeader();
  });

  el.manageGroupsBtn.addEventListener('click', openGroupModal);
  el.openAddBtn.addEventListener('click', () => openTimerModal(null));

  el.groupFilterBar.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-filter-group]');
    if (!chip) return;
    state.activeGroupId = chip.getAttribute('data-filter-group');
    saveState();
    renderGroupFilterBar();
    renderTimers();
  });

  el.closeTimerModal.addEventListener('click', closeTimerModal);
  el.cancelTimerModal.addEventListener('click', closeTimerModal);
  el.saveTimerBtn.addEventListener('click', handleSaveTimer);
  el.deleteTimerBtn.addEventListener('click', () => {
    if (!editingTimerId) return;
    deleteTimer(editingTimerId);
    closeTimerModal();
  });

  el.timerModalBackdrop.addEventListener('click', (e) => {
    if (e.target === el.timerModalBackdrop) closeTimerModal();
  });

  document.querySelectorAll('.preset-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const sec = Number(btn.getAttribute('data-sec')) || 60;
      setDrumValues(Math.floor(sec / 3600), Math.floor((sec % 3600) / 60), sec % 60);
    });
  });

  el.closeGroupModal.addEventListener('click', closeGroupModal);
  el.doneGroupModal.addEventListener('click', closeGroupModal);
  el.addGroupBtn.addEventListener('click', handleAddGroup);
  el.newGroupInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleAddGroup();
    }
  });

  el.groupModalBackdrop.addEventListener('click', (e) => {
    if (e.target === el.groupModalBackdrop) closeGroupModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeTimerModal();
      closeGroupModal();
    }
  });

  /* Init */
  buildDrum(el.drumHours, 23);
  buildDrum(el.drumMinutes, 59);
  buildDrum(el.drumSeconds, 59);
  render();
  syncAlarmLoop();
  setInterval(tick, 100);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
 "icons": [
  {
    "src": "./1353800E-0584-49E3-AA1C-7862E45F7ECF.png",
    "sizes": "1024x1024",
    "type": "image/png",
    "purpose": "any"
  }
]
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SECTA</title>
<style>
:root{--bg:#0b0b0c;--card:#17171a;--card2:#202024;--line:#2c2c31;--tx:#f4f4f5;--sub:#9a9aa2;--acc:#e5e5e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:var(--card2);border:1px solid var(--line);border-radius:16px;min-height:56px;padding:0 20px;cursor:pointer;touch-action:manipulation}
button:active{background:#2c2c31}
.screen{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}
.wrap{width:100%;max-width:560px;flex:1;display:flex;flex-direction:column;min-height:0;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px}
h1{margin:0;font-size:22px;letter-spacing:.35em;font-weight:600}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 18px;min-height:88px}
.card .main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:0;text-align:left;min-height:76px;padding:0}
.dot{width:14px;height:44px;border-radius:7px;flex:none}
.nm{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:30px;font-variant-numeric:tabular-nums;font-weight:300}
.gr{font-size:12px;color:var(--sub)}
.edit{width:56px;padding:0;background:none;border:0;color:var(--sub)}
.bar{padding:8px 0 16px;display:flex;gap:10px}
.bar .primary{flex:1;background:var(--tx);color:#000;font-weight:600;font-size:17px;border:0}
.bar .primary:active{background:#cfcfd2}
.ring{position:relative;width:min(88vw,62vh,520px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.ring .t{stroke:var(--line)}
.ring .p{stroke:var(--c,#e5e5e5);stroke-dasharray:282.74;stroke-dashoffset:282.74}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-size:min(19vw,12vh,110px);font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mid{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.ctl{display:flex;gap:12px;width:100%;max-width:560px;padding:0 16px 20px}
.ctl button{flex:1;min-height:72px;font-size:18px}
.ctl button.arm{border:2px solid #ff453a;color:#ff8a80;background:#2a1515}
.info{margin-top:14px;font-size:14px;line-height:1.7;color:#c4c4ca;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.lbl{font-size:13px;letter-spacing:.3em;color:var(--sub);margin-bottom:4px}
.up{font-size:min(9vw,48px);letter-spacing:.14em;font-weight:600}
.up2{font-size:20px;color:var(--sub);margin-top:10px;padding:0 24px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.pane{width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;border:1px solid var(--line);padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.pane h2{margin:0 0 14px;font-size:17px;font-weight:600}
label{display:block;font-size:12px;color:var(--sub);margin:14px 0 6px;letter-spacing:.08em}
input[type=text],input[type=number]{width:100%;height:56px;background:var(--bg);border:1px solid var(--line);border-radius:14px;color:var(--tx);font-size:18px;padding:0 14px}
input[type=range]{width:100%;height:44px;accent-color:#ddd}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:48px;min-height:48px;height:48px;padding:0;border-radius:50%;border:3px solid transparent}
.sw button.sel{border-color:#fff}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:52px;padding:0}
.seg button.sel{background:var(--tx);color:#000}
.acts{display:flex;gap:10px;margin-top:20px}
.acts button{flex:1}
.acts .ok{background:var(--tx);color:#000;border:0;font-weight:600}
.danger{color:#ff8a80}
.empty{color:var(--sub);text-align:center;padding:40px 0}
@media(min-width:700px){.card:hover{background:#1c1c20}}
</style>
</head>
<body>

<section class="screen on" id="s-home">
 <div class="wrap">
  <header><h1>SECTA</h1><button id="bSet" aria-label="設定" style="min-height:48px;padding:0 16px">音設定</button></header>
  <div class="list" id="list"></div>
  <div class="bar"><button class="primary" id="bNew">＋ 新規タイマー</button></div>
 </div>
</section>

<section class="screen" id="s-pre">
 <div class="mid"><div class="ring" id="preRing" style="--c:#e5e5e5">
  <svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="45"/><circle class="p" id="preP" cx="50" cy="50" r="45"/></svg>
  <div class="c"><div class="lbl">GET READY</div><div class="big" id="preN" style="font-weight:300">10</div><div class="up2" id="preName"></div></div>
 </div></div>
 <div class="ctl"><button id="preCancel">キャンセル</button></div>
</section>

<section class="screen" id="s-run">
 <div class="mid"><div class="ring" id="runRing">
  <svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="45"/><circle class="p" id="runP" cx="50" cy="50" r="45"/></svg>
  <div class="c"><div class="big" id="runT">00:00</div><div class="info" id="runInfo"></div></div>
 </div></div>
 <div class="ctl"><button id="bStop">停止</button><button id="bPause">中断</button></div>
</section>

<section class="screen" id="s-end">
 <div class="mid"><div class="ring" id="endRing">
  <svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="45"/><circle class="p" cx="50" cy="50" r="45" style="stroke-dashoffset:0"/></svg>
  <div class="c"><div class="up">TIME IS UP</div><div class="up2" id="endName"></div></div>
 </div></div>
 <div class="ctl"><button id="bMute">アラーム停止</button><button id="bBack" style="background:var(--tx);color:#000;border:0;font-weight:600">戻る</button></div>
</section>

<div class="sheet" id="edSheet"><div class="pane">
 <h2 id="edTitle">新規タイマー</h2>
 <label>タイマー名</label><input type="text" id="fName" maxlength="24" placeholder="例：ストレッチ">
 <label>設定時間</label>
 <div class="row"><input type="number" id="fHr" inputmode="numeric" min="0" max="99"><span style="flex:none">時間</span><input type="number" id="fMin" inputmode="numeric" min="0"><span style="flex:none">分</span><input type="number" id="fSec" inputmode="numeric" min="0"><span style="flex:none">秒</span></div>
 <label>開始前の猶予時間：<span id="fGv">10</span> 秒</label>
 <input type="range" id="fGr" min="5" max="25" step="1" value="10">
 <label>カラー</label><div class="sw" id="fSw"></div>
 <div class="acts"><button id="edDel" class="danger">削除</button><button id="edCancel">閉じる</button><button id="edOk" class="ok">保存</button></div>
</div></div>

<div class="sheet" id="stSheet"><div class="pane">
 <h2>アラーム設定</h2>
 <label>音量：<span id="vV">70</span>%</label>
 <input type="range" id="sVol" min="0" max="100" value="70">
 <label>終了ボイス（1回だけ）</label>
 <div class="seg" id="sVoice"><button data-v="1">ON</button><button data-v="0">OFF</button></div>
 <label>アラーム（ベルは1回のみ、他は停止するまで繰り返し）</label>
 <div class="seg" id="sAlarm"><button data-v="1">ON</button><button data-v="0">OFF</button></div>
 <label>アラーム音の種類</label>
 <div class="seg" id="sSnd"><button data-s="beep">ビープ</button><button data-s="bell">ベル</button><button data-s="pulse">パルス</button></div>
 <div class="acts"><button id="sTest">試聴</button><button id="stOk" class="ok">閉じる</button></div>
</div></div>

const load=()=>{try{const t=JSON.parse(localStorage.getItem('secta.t'));if(Array.isArray(t))timers=t;const s=JSON.parse(localStorage.getItem('secta.s'));if(s)set=Object.assign(set,s)}catch(e){}

 timers.forEach(t=>{const d=document.createElement('div');d.className='card';

  l.appendChild(d)})}

/* editor */
function swatches(){const s=$('fSw');s.innerHTML='';COLORS.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.className=c===fColor?'sel':'';b.setAttribute('aria-label',c);b.onclick=()=>{fColor=c;swatches()};s.appendChild(b)});
 const i=document.createElement('input');i.type='color';i.value=/^#[0-9a-f]{6}$/i.test(fColor)?fColor:'#ffffff';i.style.cssText='width:48px;height:48px;border:0;background:none;padding:0';i.oninput=()=>{fColor=i.value;document.querySelectorAll('#fSw button').forEach(b=>b.classList.remove('sel'))};s.appendChild(i)}
function openEd(id){editId=id;delArm=false;const t=timers.find(x=>x.id===id);
 $('edTitle').textContent=t?'タイマーを編集':'新規タイマー';
 $('fName').value=t?t.name:'';setHMS(t?t.sec:300);
 $('fGr').value=t?t.grace:10;$('fGv').textContent=$('fGr').value;fColor=t?t.color:COLORS[5];
 $('edDel').style.display=t?'':'none';$('edDel').textContent='削除';swatches();$('edSheet').classList.add('on')}
$('bNew').onclick=()=>openEd(null);
$('fGr').oninput=e=>$('fGv').textContent=e.target.value;
function setHMS(s){$('fHr').value=Math.floor(s/3600);$('fMin').value=Math.floor(s%3600/60);$('fSec').value=s%60}
['fHr','fMin','fSec'].forEach(i=>$(i).onchange=()=>setHMS((+$('fHr').value||0)*3600+(+$('fMin').value||0)*60+(+$('fSec').value||0)));
$('edCancel').onclick=()=>$('edSheet').classList.remove('on');
$('edOk').onclick=()=>{let sec=(+$('fHr').value||0)*3600+(+$('fMin').value||0)*60+(+$('fSec').value||0);if(sec<1)sec=1;
 const o={name:$('fName').value.trim()||'タイマー',sec,color:fColor,grace:+$('fGr').value};
 if(editId){Object.assign(timers.find(x=>x.id===editId),o)}else timers.push(Object.assign({id:'t'+Date.now()},o));
 save();render();$('edSheet').classList.remove('on')};
$('edDel').onclick=()=>{if(!delArm){delArm=true;$('edDel').textContent='もう一度押して削除';return}
 timers=timers.filter(x=>x.id!==editId);save();render();$('edSheet').classList.remove('on')};
$('edSheet').onclick=e=>{if(e.target.id==='edSheet')$('edSheet').classList.remove('on')};

/* audio */
function unlock(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();if(!voiceBuf&&!unlock.d){unlock.d=1;const bin=atob(VOICE_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);ac.decodeAudioData(u.buffer,x=>voiceBuf=x,()=>{})}}catch(e){}}
function tone(f,t0,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
 const a=Math.max(.0001,v*set.vol);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(a,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.start(t0);o.stop(t0+d+.05)}
function once(){if(!ac||set.vol<=0)return;const n=ac.currentTime+.02;
 if(set.sound==='bell'){tone(660,n,1.1,'sine',.9);tone(990,n,.8,'sine',.5);tone(1320,n+.02,.5,'sine',.25)}
 else if(set.sound==='pulse'){for(let i=0;i<3;i++)tone(440,n+i*.22,.16,'sawtooth',.4)}
 else{for(let i=0;i<3;i++)tone(880,n+i*.18,.1,'square',.3)}}
function playVoice(){if(!set.voice||!voiceBuf||!ac||set.vol<=0)return 0;const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=set.vol;s.buffer=voiceBuf;s.connect(g);g.connect(ac.destination);s.start();return voiceBuf.duration*1000+400}
function alarmOn(){alarmOff();unlock();const d=playVoice();if(!set.alarm)return;alarmT=setTimeout(()=>{once();if(set.sound!=='bell')alarmT=setInterval(once,1500)},d)}
function alarmOff(){clearInterval(alarmT);alarmT=0}

/* settings */
function segSync(){document.querySelectorAll('#sSnd button').forEach(b=>b.classList.toggle('sel',b.dataset.s===set.sound));
 [['sVoice','voice'],['sAlarm','alarm']].forEach(([id,k])=>document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('sel',(b.dataset.v==='1')===!!set[k])))}
[['sVoice','voice'],['sAlarm','alarm']].forEach(([id,k])=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{set[k]=b.dataset.v==='1';save();segSync();unlock()}));
$('bSet').onclick=()=>{$('sVol').value=Math.round(set.vol*100);$('vV').textContent=Math.round(set.vol*100);segSync();$('stSheet').classList.add('on')};
$('sVol').oninput=e=>{set.vol=e.target.value/100;$('vV').textContent=e.target.value;save()};
document.querySelectorAll('#sSnd button').forEach(b=>b.onclick=()=>{set.sound=b.dataset.s;save();segSync();unlock();once()});
$('sTest').onclick=()=>{unlock();const d=playVoice();if(set.alarm)setTimeout(once,d)};
$('stOk').onclick=()=>$('stSheet').classList.remove('on');
$('stSheet').onclick=e=>{if(e.target.id==='stSheet')$('stSheet').classList.remove('on')};

/* run */
async function keepAwake(on){try{if(on&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen')}else if(wl){wl.release();wl=null}}catch(e){}}
function ring(id,c){$(id).style.setProperty('--c',c)}
function start(t){unlock();cancelAnimationFrame(raf);cur={t,phase:'pre',end:Date.now()+t.grace*1000,paused:false,rem:0};persist();try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
 ring('preRing',t.color);ring('runRing',t.color);ring('endRing',t.color);
 $('preName').textContent=t.name;$('bPause').textContent='中断';show('s-pre');keepAwake(true);loop()}
function loop(){tick();if(cur&&cur.phase!=='end')raf=requestAnimationFrame(loop)}
function tick(){if(!cur)return;const now=Date.now();
 if(cur.phase==='pre'){const r=cur.end-now;
  if(r<=0){const pe=cur.end;cur.phase='run';cur.total=cur.t.sec*1000;cur.end=pe+cur.total;cur.startAt=pe;persist();showInfo();$('runP').style.strokeDashoffset=C;show('s-run');runTick(now)}
  else{$('preN').textContent=Math.ceil(r/1000);$('preP').style.strokeDashoffset=C*(r/(cur.t.grace*1000))}}
 else if(cur.phase==='run'&&!cur.paused)runTick(now)}
function runTick(now){const r=cur.end-now;
 if(r<=0){finish();return}
 $('runT').textContent=fmt(Math.ceil(r/1000));$('runP').style.strokeDashoffset=C*(r/cur.total)}
function finish(){cancelAnimationFrame(raf);cur.phase='end';persist();notify();$('endName').textContent=cur.t.name;show('s-end');alarmOn();
 if(navigator.vibrate)try{navigator.vibrate([300,150,300])}catch(e){}}
function home(){cancelAnimationFrame(raf);alarmOff();cur=null;try{localStorage.removeItem('secta.r')}catch(e){}keepAwake(false);show('s-home')}
$('preCancel').onclick=home;
let stopT=0;
function stopReset(){clearTimeout(stopT);$('bStop').classList.remove('arm');$('bStop').textContent='停止'}
$('bStop').onclick=()=>{if($('bStop').classList.contains('arm')){stopReset();home()}else{$('bStop').classList.add('arm');$('bStop').textContent='本当に停止？';stopT=setTimeout(stopReset,3000)}};
const hm=ts=>new Date(ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
function showInfo(){if(!cur||!cur.startAt)return;$('runInfo').innerHTML='開始 '+hm(cur.startAt)+'<br>終了予定 '+(cur.paused?'中断中':hm(cur.end))}
$('bPause').onclick=()=>{if(!cur||cur.phase!=='run')return;
 if(!cur.paused){cur.paused=true;cur.rem=cur.end-Date.now();$('bPause').textContent='再開'}
 else{cur.paused=false;cur.end=Date.now()+cur.rem;$('bPause').textContent='中断'}persist();showInfo()};
$('bMute').onclick=alarmOff;
$('bBack').onclick=home;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cur&&cur.phase!=='end'){keepAwake(true);tick()}});
setInterval(()=>{if(cur&&cur.phase!=='end')tick()},1000);
function persist(){if(!cur)return;try{localStorage.setItem('secta.r',JSON.stringify({t:cur.t,phase:cur.phase,end:cur.end,paused:cur.paused,rem:cur.rem,startAt:cur.startAt}))}catch(e){}}
function notify(){try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted')new Notification('TIME IS UP',{body:cur.t.name,requireInteraction:true,tag:'secta'})}catch(e){}}
function restore(){let r;try{r=JSON.parse(localStorage.getItem('secta.r'))}catch(e){}
 if(!r||!r.t)return;const t=r.t;cur={t,phase:r.phase,end:r.end,paused:r.paused,rem:r.rem,startAt:r.startAt,total:t.sec*1000};
 ['preRing','runRing','endRing'].forEach(i=>ring(i,t.color));$('preName').textContent=t.name;
 if(cur.phase==='pre'&&Date.now()>=cur.end){cur.phase='run';cur.startAt=cur.end;cur.end+=cur.total}
 if(cur.phase==='end'){finish();return}
 if(cur.phase==='pre'){show('s-pre')}
 else if(cur.paused){$('bPause').textContent='再開';$('runT').textContent=fmt(Math.ceil(cur.rem/1000));$('runP').style.strokeDashoffset=C*(cur.rem/cur.total);show('s-run')}
 else if(cur.end<=Date.now()){finish();return}
 else{$('runP').style.strokeDashoffset=C;show('s-run')}
 persist();showInfo();keepAwake(true);loop()}

load();if(!set.v3){if(set.sound==='voice')set.sound='beep';set.voice=true;set.alarm=true;set.v3=1;save()}render();restore();
</script>
</body>
